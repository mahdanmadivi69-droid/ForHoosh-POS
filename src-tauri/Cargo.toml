[package]
name = "karwand-launcher"
version = "0.16.0"
description = "KarWand POS Native Local-First Terminal Harness"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
serialport = "4.5"
